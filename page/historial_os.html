<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Historial OS - QATA</title>
<link rel="icon" href="../imagenes/icono.png"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<style>body{background:#f4f7f6;padding-top:85px;font-family:'Segoe UI',sans-serif}.navbar{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05)}.panel{max-width:1500px;margin:auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.table{font-size:.82rem}.form-label-sm{font-size:.72rem;font-weight:700;text-transform:uppercase;color:#666}.dropdown-menu{border:none;box-shadow:0 10px 30px rgba(0,0,0,.1);border-radius:12px}</style>
</head>
<body>
<nav class="navbar fixed-top"><div class="container-fluid px-4"><a href="menu.html"><img src="../imagenes/LOGOQATA.png" style="height:40px"></a><div class="ms-auto d-flex gap-2"><a href="orden_servicio.html" class="btn btn-success btn-sm"><i class="bi bi-plus-circle"></i> Nueva OS</a><button id="btnCerrarSesion" class="btn btn-outline-danger btn-sm">Salir</button></div></div></nav>
<main class="container-fluid px-md-4 mb-5"><div class="panel">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><h3 class="fw-bold text-success m-0"><i class="bi bi-clock-history"></i> Historial de Órdenes de Servicio</h3><div class="d-flex gap-2"><button id="btnExportarOS" class="btn btn-outline-success btn-sm"><i class="bi bi-file-earmark-excel"></i> Exportar Excel</button><a href="menu.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-house"></i> Inicio</a></div></div>
<div class="row g-2 bg-light border rounded p-3 mb-3"><div class="col-md-5"><label class="form-label-sm">Buscar</label><input id="buscarOS" class="form-control form-control-sm" placeholder="N° OS, referencia, RUC, proveedor, SOLPED..."></div><div class="col-md-3"><label class="form-label-sm">Proyecto</label><select id="filtroProyectoOS" class="form-select form-select-sm"><option value="">TODOS</option></select></div><div class="col-md-2"><label class="form-label-sm">Desde</label><input id="desdeOS" type="date" class="form-control form-control-sm"></div><div class="col-md-2"><label class="form-label-sm">Hasta</label><input id="hastaOS" type="date" class="form-control form-control-sm"></div></div>
<div class="table-responsive"><table class="table table-hover table-bordered align-middle"><thead class="table-dark text-center"><tr><th>OS</th><th>NRO.</th><th>FECHA</th><th>PROVEEDOR</th><th>RUC</th><th>PROYECTO</th><th>CLASIFICACIÓN</th><th>SOLPED</th><th>ENTREGA</th><th>TOTAL</th><th>ACCIONES</th></tr></thead><tbody id="tablaOS"></tbody></table></div>
</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script type="module" src="../js/consultar-os.js"></script>

<script type="module" src="../js/role-ui.js"></script>
<script type="module" src="../js/seguridad.js"></script>
</body></html>

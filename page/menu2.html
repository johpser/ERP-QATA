<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QATA - Operaciones</title>
    <link rel="icon" type="image/png" href="../imagenes/icono.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        html, body { min-height:100%; margin:0; }
        body { background:#f4f7f6; font-family:'Segoe UI',sans-serif; }
        .navbar { background:white; box-shadow:0 2px 10px rgba(0,0,0,.05); }
        .main-container { min-height:calc(100vh - 75px); display:flex; align-items:center; padding:28px 20px; }
        .module-card { border:none; border-radius:15px; transition:.25s; text-decoration:none; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; min-height:190px; background:white; box-shadow:0 4px 15px rgba(0,0,0,.05); }
        .module-card:hover { transform:translateY(-7px); background:#1a1a1a; box-shadow:0 10px 25px rgba(0,0,0,.18); }
        .module-card:hover .icon-box,.module-card:hover .module-title { color:white!important; }
        .icon-box { font-size:3rem; color:#007bff; margin-bottom:16px; transition:.25s; }
        .module-title { font-weight:800; color:#444; text-transform:uppercase; font-size:.88rem; text-align:center; transition:.25s; }
        .role-badge { font-size:.72rem; letter-spacing:.03em; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-4 py-2">
        <img src="../imagenes/LOGOQATA.png" alt="Logo" style="height:40px">
        <div class="ms-auto d-flex align-items-center gap-3">
            <div class="text-end d-none d-sm-block">
                <div class="fw-bold text-secondary">PANEL OPERATIVO</div>
                <span id="rolActual" class="badge text-bg-light border role-badge">Cargando rol...</span>
            </div>
            <button id="btnCerrarSesion" class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-bold"><i class="bi bi-box-arrow-right me-1"></i> CERRAR SESIÓN</button>
        </div>
    </div>
</nav>

<div class="main-container">
    <div class="container" style="max-width:1100px">
        <div id="modulosRol" class="row justify-content-center g-4">
            <div class="col-12 text-center text-muted py-5"><span class="spinner-border spinner-border-sm me-2"></span>Cargando módulos...</div>
        </div>
    </div>
</div>

<script type="module">
    import { auth, db } from '../js/config.js';
    import { signOut, onAuthStateChanged } from '../js/supabase-auth-compat.js';
    import { doc, getDoc } from '../js/supabase-db-compat.js';
    import { nombreRol } from '../js/role-ui.js';
    import { modulosMenuPorPerfil, normalizarRol } from '../js/access-control.js';

    const cont = document.getElementById('modulosRol');
    const badge = document.getElementById('rolActual');

    onAuthStateChanged(auth, async user => {
        if (!user) return window.location.href='../index.html';
        try {
            const snap = await getDoc(doc(db,'usuarios',user.uid));
            if (!snap.exists()) throw new Error('Perfil ERP no asignado');
            const perfil = snap.data() || {};
            const rol = normalizarRol(perfil.rol);
            if (rol === 'admin') return window.location.href='menu.html';
            const modulos = modulosMenuPorPerfil(perfil);
            badge.textContent = nombreRol(rol);
            cont.innerHTML = modulos.map(m => `
                <div class="col-10 col-sm-6 col-md-4">
                    <a href="${m.href}" class="module-card">
                        <div class="icon-box"><i class="bi ${m.icon}"></i></div>
                        <h6 class="module-title">${m.label}</h6>
                    </a>
                </div>`).join('') || '<div class="alert alert-warning">Este usuario no tiene módulos asignados.</div>';
        } catch (e) {
            console.error(e);
            cont.innerHTML='<div class="alert alert-danger">No se pudo cargar el perfil del usuario.</div>';
        }
    });

    document.getElementById('btnCerrarSesion').onclick = async () => {
        await signOut(auth);
        window.location.href='../index.html';
    };
</script>
<script type="module" src="../js/seguridad.js"></script>
</body>
</html>
